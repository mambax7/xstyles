# Release — XOOPS module DevOps baseline.
# Profile: XoopsCore27 / PHP 8.2+
# xoops-overlay:profile=core27
#
# On a version tag, build a CLEAN distribution ZIP with `git archive`, which honors
# the `export-ignore` rules in .gitattributes — so the release contains only what a
# site administrator should install (no .github/, tests/, phpstan*, rector.php, …) —
# then attach it to the GitHub Release. This is what makes the export-ignore set pay off.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9A-Za-z]*'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9A-Za-z]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    uses: ./.github/workflows/ci.yml

  release:
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build clean release archive
        id: archive
        run: |
          # Module dirname drives the ZIP name and the in-archive top folder.
          NAME="$(php tests/helpers/detect-dirname.php)"
          ZIP="${NAME}-${GITHUB_REF_NAME}.zip"
          NOTES="docs/RELEASE-${GITHUB_REF_NAME#v}.md"
          test -f "$NOTES" || { echo "Missing release notes: $NOTES" >&2; exit 1; }
          git archive --format=zip --prefix="${NAME}/" -o "$ZIP" HEAD
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.archive.outputs.zip }}
          # Published version archives are immutable; corrections require a new tag.
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: ${{ steps.archive.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
