# CI — XOOPS module DevOps baseline.
# Profile: XoopsCore27 / PHP 8.2+
# xoops-overlay:profile=core27
#
# Quality tools live outside the module checkout, like the shared xoops_lib vendor locally.
# Runs CS-Fixer check, PHPStan, Rector dry-run and PHPUnit on the supported PHP matrix.
# When the org hosts a shared reusable workflow you can
# replace this whole job with:
#   uses: XoopsModules27x/.github/.github/workflows/module-ci.yml@v1
name: CI

on:
  workflow_call:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: dom, mbstring, xml

      - name: Install shared runner tools
        env:
          XOOPS_TOOLS: ${{ runner.temp }}/xoops-tools
        run: |
          mkdir -p "$XOOPS_TOOLS"
          composer --working-dir="$XOOPS_TOOLS" init --name=xoops/ci-tools --no-interaction
          composer --working-dir="$XOOPS_TOOLS" config allow-plugins.phpstan/extension-installer true
          composer --working-dir="$XOOPS_TOOLS" require --dev --no-interaction --no-progress \
            'phpunit/phpunit:^11.5' 'friendsofphp/php-cs-fixer:^3.64' \
            'phpstan/phpstan:^2.0' 'phpstan/extension-installer:^1.4' \
            'phpstan/phpstan-deprecation-rules:^2.0' 'phpstan/phpstan-strict-rules:^2.0' \
            'rector/rector:^2.0' 'xoops/rector-xoops:^1.0@alpha' \
            'roave/security-advisories:dev-latest'

      - name: Quality gate
        env:
          XOOPS_TOOLS: ${{ runner.temp }}/xoops-tools
        run: |
          php "$XOOPS_TOOLS/vendor/bin/php-cs-fixer" fix --dry-run --diff --config=.php-cs-fixer.dist.php
          php "$XOOPS_TOOLS/vendor/bin/phpstan" analyse --configuration=phpstan.neon.dist --memory-limit=512M
          php "$XOOPS_TOOLS/vendor/bin/rector" process --dry-run
          php "$XOOPS_TOOLS/vendor/bin/phpunit" --configuration=phpunit.xml.dist

      - name: JavaScript syntax
        run: for file in assets/js/*.js; do node --check "$file"; done
